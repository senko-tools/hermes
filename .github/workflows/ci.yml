name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Full debug info for every test binary fills the runner's disk; line tables are enough
  # for backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        # ALSA for cpal; GTK, libxdo and appindicator for the GUI's tray icon (tray-icon, muda);
        # xkbcommon, fontconfig, freetype and Wayland for gpui (hermes-gui); PipeWire and clang (for
        # its bindings) for Linux screen sharing and a share's sound.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev \
            libpipewire-0.3-dev libspa-0.2-dev clang
      - name: PipeWire headers (older systems)
        # The pipewire crate needs PipeWire 1.0's headers; older systems get Ubuntu 24.04's, while
        # the binary still links the system's library (crates/hermes-gui/linux/pipewire-headers.sh).
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! pkg-config --atleast-version=1.0 libpipewire-0.3; then
            echo "PKG_CONFIG_PATH=$(bash crates/hermes-gui/linux/pipewire-headers.sh "$RUNNER_TEMP/pipewire")" >> "$GITHUB_ENV"
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked -- --skip timing_
      # Tests named `timing_*` depend on the runner's speed (shared runners stall now and then):
      # a failure here is a warning on the run, not a failed check.
      - name: Timing-sensitive tests (warn only)
        shell: bash
        run: |
          if ! cargo test --workspace --locked -- timing_; then
            echo "::warning title=Timing-sensitive test failed::A timing_* test failed on ${{ runner.os }}; see this step's log. It does not fail the check."
          fi
