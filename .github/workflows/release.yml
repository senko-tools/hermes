name: release

# Builds every release artifact from PLAN.md section 18.1 and publishes them as one GitHub release
# (a pre-release for versions with a `-`, e.g. 0.1.0-alpha.6):
#   - hermes-server for x86_64 and aarch64 Linux (static musl) and x86_64 Windows
#   - the Docker image ghcr.io/senko-tools/hermes-server (amd64 + arm64)
#   - Hermes-Setup-<version>.exe (Inno Setup installer with hermes:// links, from
#     crates/hermes-gui/installer.iss), Hermes-<version>-portable.zip (GUI + TUI for Windows), both
#     with an LGPL FFmpeg for sound and video files, and hermes-tui for Windows and Linux
#   - install.sh, hermes.service, egg-hermes.json and SHA256SUMS
# macOS builds are left out for now.
#
# To release: bump the version in Cargo.toml, rename `## Unreleased` in CHANGELOG.md to
# `## <version>` (the release's text comes from that section; no section, no release), push `dev`, then
# Actions > release > Run workflow on `dev` with that version (`gh workflow run release.yml --ref
# dev -f version=1.3.0`). The workflow tags the commit `v<version>` itself. Running on `dev` lets
# the builds use the Rust caches of earlier `dev` runs; a tag push still releases too, but GitHub
# gives a tag run no caches from `dev`, so everything is compiled from scratch.
#
# Anything else is a dry run: everything is built and uploaded as workflow artifacts, but no
# release is created and no image is pushed. A dry run starts when this workflow or the release
# Dockerfile changes on `dev`, or by hand without a version.
on:
  push:
    tags: ["v*"]
    branches: [dev]
    paths:
      - .github/workflows/release.yml
      - deploy/docker/Dockerfile.release
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.3.0 (must match Cargo.toml); empty for a dry run"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  IMAGE: ghcr.io/senko-tools/hermes-server

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            sh .github/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::version $version is not the one in Cargo.toml ($cargo_version)"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::tag v$version already exists"
              exit 1
            fi
            # No release without notes: checked here, before anything is built.
            sh .github/release-notes.sh "$version" > /dev/null
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  server-linux:
    name: server ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl toolchain (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Build (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --locked -p hermes-server --target ${{ matrix.target }}
      - name: Build (aarch64, cross-compiled with zig)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          pip3 install --user cargo-zigbuild
          cargo zigbuild --release --locked -p hermes-server --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir dist
          bin="target/${{ matrix.target }}/release/hermes-server"
          file "$bin"
          file "$bin" | grep -Eq "static(ally|-pie) linked"
          tar -czf "dist/hermes-server-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" hermes-server
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  server-windows:
    name: server x86_64-pc-windows-msvc
    # Its own runner: the GUI job's build is the slowest part of a release.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # No VC++ redistributable needed on the user's machine.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-windows
      - name: Build
        run: cargo build --release --locked -p hermes-server
      - name: Package
        run: |
          mkdir -p dist stage
          cp target/release/hermes-server.exe LICENSE-AGPL-3.0 stage/
          (cd stage && 7z a -tzip -bso0 "../dist/hermes-server-x86_64-pc-windows-msvc.zip" .)
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows-server
          path: dist/
          if-no-files-found: error

  windows:
    name: windows (GUI, TUI)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # No VC++ redistributable needed on the user's machine.
      RUSTFLAGS: -C target-feature=+crt-static
      VERSION: ${{ needs.version.outputs.version }}
      # The key updates are checked with, built into the app (public; a repository variable).
      # Without it the app only says that a new version exists.
      HERMES_UPDATE_PUBLIC_KEY: ${{ vars.HERMES_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # `-nasm`: builds cached from before NASM was installed lack OpenH264's assembly.
          key: windows-gui-release-nasm
      - name: NASM
        # OpenH264's SIMD assembly. Without NASM its build quietly falls back to plain C, and
        # screen sharing encodes several times slower.
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"
      - name: Build
        # Everything this job needs in one cargo run: hermes.exe, hermes-tui.exe and make-update.
        # A second cargo run with another set of packages would unify dependency features
        # differently and rebuild ~120 crates (12 min).
        run: cargo build --release --locked -p hermes-gui -p hermes-tui -p hermes-client-core
      - name: Check that OpenH264 has its assembly
        run: |
          if grep -rqs "not using any assembly" target/release/build/openh264-sys2-*/output; then
            echo "OpenH264 was built without NASM" >&2
            exit 1
          fi
      - name: FFmpeg
        # Plays sound and video files in the chat; the installer and the portable zip carry it next
        # to hermes.exe. BtbN's LGPL build with shared libraries (ffmpeg.exe and ffprobe.exe share
        # one set of DLLs). Only an LGPL build may ship with Hermes.
        env:
          GH_TOKEN: ${{ github.token }}
          FFMPEG_ZIP: ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip
        run: |
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern "$FFMPEG_ZIP" --dir ffdl
          7z x -bso0 "ffdl/$FFMPEG_ZIP" -offdl
          src=$(echo ffdl/ffmpeg-*/)
          mkdir -p target/ffmpeg
          cp "$src"bin/ffmpeg.exe "$src"bin/ffprobe.exe "$src"bin/*.dll target/ffmpeg/
          cp "$src"LICENSE.txt target/ffmpeg/FFMPEG-LICENSE.txt
          version=$(target/ffmpeg/ffmpeg.exe -hide_banner -version)
          echo "$version" | head -1
          if echo "$version" | grep -q -- "--enable-gpl"; then
            echo "this FFmpeg build is GPL, not LGPL" >&2
            exit 1
          fi
          ls -l target/ffmpeg
      - name: Package
        run: |
          mkdir -p dist stage/portable stage/tui
          r=target/release
          cp "$r/hermes.exe" "$r/hermes-tui.exe" LICENSE-GPL-3.0 target/ffmpeg/* stage/portable/
          cp "$r/hermes-tui.exe" LICENSE-GPL-3.0 stage/tui/
          (cd stage/portable && 7z a -tzip -bso0 "../../dist/Hermes-$VERSION-portable.zip" .)
          # The zip alone gets the portable marker (the same as a portable install writes): in
          # stage/portable it would also go into the installer and the update files, and make
          # every install portable.
          mkdir -p stage/marker
          printf '%s\n' \
            '# This file makes Hermes portable: with it next to hermes.exe, Hermes keeps its settings,' \
            '# data and logs in this folder. Settings are added here as you change them.' \
            > stage/marker/config.toml
          (cd stage/marker && 7z a -tzip -bso0 "../../dist/Hermes-$VERSION-portable.zip" config.toml)
          (cd stage/tui && 7z a -tzip -bso0 "../../dist/hermes-tui-$VERSION-x86_64-pc-windows-msvc.zip" .)
          ls -l dist
      - name: Installer
        # Inno Setup 6.6 or newer builds it from crates/hermes-gui/installer.iss. The runner image
        # has one installed for all users (installing ours per user beside it hung the step);
        # without it, the pinned and checked one is installed for this run only. The installer carries the files of
        # stage/portable, the same as the portable zip and the update files.
        shell: pwsh
        # The compile takes a few minutes; anything much longer is a hang, not a slow build.
        timeout-minutes: 20
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          INNO_SHA256: 9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732
        run: |
          function Say($text) { Write-Host "$(Get-Date -Format HH:mm:ss) $text" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # Its files carry no version (6.7.1 in the image's notes); one too old fails the compile
          # with an error.
          if (Test-Path $iscc) {
            Say "using the runner's Inno Setup 6"
          } else {
            $inno = Join-Path $env:RUNNER_TEMP innosetup
            Say "installing Inno Setup 6.7.3"
            Invoke-WebRequest $env:INNO_URL -OutFile innosetup.exe
            if ((Get-FileHash innosetup.exe -Algorithm SHA256).Hash -ne $env:INNO_SHA256) {
              throw "Inno Setup download does not match its checksum"
            }
            # Its setup opens the IDE (Compil32) when it is done, even when silent, and
            # `Start-Process -Wait` would wait for that too: wait for the setup alone.
            $setup = Start-Process innosetup.exe -PassThru -ArgumentList '/VERYSILENT',
              '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$inno",
              "/LOG=$env:RUNNER_TEMP\innosetup.log"
            if (-not $setup.WaitForExit(300000)) {
              Get-Content "$env:RUNNER_TEMP\innosetup.log" -ErrorAction SilentlyContinue
              throw "Inno Setup's setup did not finish in 5 minutes"
            }
            Get-Process Compil32 -ErrorAction SilentlyContinue | Stop-Process -Force
            $iscc = "$inno\ISCC.exe"
            if (-not (Test-Path $iscc)) { throw "Inno Setup did not install" }
          }
          # Windows wants numbers only in the file version (a dry run's version is dev-<commit>).
          $fileVersion = if ($env:VERSION -match '^\d+\.\d+\.\d+') { $Matches[0] } else { '0.0.0' }
          Say "compiling the installer"
          & $iscc /Q "/DVersion=$env:VERSION" "/DFileVersion=$fileVersion" crates\hermes-gui\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Say "done"
          Get-Item "dist\Hermes-Setup-$env:VERSION.exe"
      - name: Update files
        # What the app's updater downloads (crates/hermes-client-core/src/updater.rs): every file
        # of the portable folder compressed, patches from the last three releases' files, and
        # the manifest signed with UPDATE_SIGNING_KEY (a secret; `make-update keygen` makes it).
        # make-update was built in the Build step and compresses on every core.
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::notice::UPDATE_SIGNING_KEY is not set: no update files, the app will only link to the release"
            exit 0
          fi
          previous=()
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 10 --exclude-drafts               --json tagName -q '.[].tagName' | grep -v "^v$VERSION$" | head -3); do
            mkdir -p "prev/$tag"
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY"                 --pattern 'Hermes-*-portable.zip' --dir "prev/$tag"; then
              7z x -bso0 "prev/$tag"/*.zip -o"prev/$tag/files"
              previous+=(--previous "prev/$tag/files")
            fi
          done
          target/release/make-update.exe build --dir stage/portable --version "$VERSION"             --out update "${previous[@]}"
          cp update/* dist/
          ls -l update
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  tui-linux:
    name: tui x86_64-unknown-linux-gnu
    needs: version
    # The oldest supported runner, so the binary runs on older glibc versions too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tui-linux
      - name: ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build
        run: cargo build --release --locked -p hermes-tui
      - name: Package
        run: |
          mkdir -p dist stage
          cp target/release/hermes-tui LICENSE-GPL-3.0 stage/
          tar -czf "dist/hermes-tui-$VERSION-x86_64-unknown-linux-gnu.tar.gz" -C stage .
      - uses: actions/upload-artifact@v7
        with:
          name: tui-linux
          path: dist/
          if-no-files-found: error

  docker:
    name: docker image
    needs: [version, server-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: server-*
          path: artifacts
          merge-multiple: true
      - name: Build context
        # The image only copies the binaries built above: nothing is compiled under emulation.
        run: |
          mkdir -p ctx/bin/amd64 ctx/bin/arm64 ctx/data
          tar -xzf artifacts/hermes-server-x86_64-unknown-linux-musl.tar.gz -C ctx/bin/amd64
          tar -xzf artifacts/hermes-server-aarch64-unknown-linux-musl.tar.gz -C ctx/bin/arm64
          cp deploy/docker/Dockerfile.release ctx/Dockerfile
      - name: Tags
        id: tags
        run: |
          tags="$IMAGE:$VERSION"
          case "$VERSION" in
            *-*) ;;
            *) tags="$tags,$IMAGE:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

  release:
    needs: [version, server-linux, server-windows, windows, tui-linux, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only the release files (the Docker job uploads a build record artifact too).
      - uses: actions/download-artifact@v7
        with:
          pattern: server-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: windows-server
          path: dist
      - uses: actions/download-artifact@v7
        with:
          name: tui-linux
          path: dist
      - name: Add the install files and checksums
        working-directory: dist
        run: |
          cp ../deploy/systemd/hermes.service ../deploy/install.sh ../deploy/pterodactyl/egg-hermes.json .
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # The release text, from CHANGELOG.md (a dry run shows what `## Unreleased` would give).
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            sh .github/release-notes.sh "$VERSION" > notes.md
          else
            sh .github/release-notes.sh Unreleased > notes.md || echo "(no notes yet)" > notes.md
          fi
          cat notes.md
      - name: Upload (dry run)
        if: needs.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: dist/
      - name: Create release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          # On a dispatch run this also creates the tag, on the commit that was built.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Hermes $TAG" --notes-file notes.md $flags
