<!DOCTYPE html>
<!-- Static landing page for hermes.senko.tools (nginx, /var/www/hermes). Same look as the
     server's built-in page in crates/hermes-server/src/api/page.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="hermes.senko.tools: the official Hermes chat server.">
<title>Hermes</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #15161a; color: #e6e6eb; padding: 24px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 420px; background: #1e2026; border: 1px solid #2c2f37;
    border-radius: 12px; padding: 32px; text-align: center;
  }
  .icon {
    width: 88px; height: 88px; border-radius: 22px; margin: 0 auto 16px; display: flex;
    align-items: center; justify-content: center; background: #3b4a8c; color: #fff;
    font-size: 40px; font-weight: 600; overflow: hidden;
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; }
  .eyebrow { margin: 0; color: #9a9caa; font-size: 14px; }
  h1 { margin: 4px 0 8px; font-size: 24px; line-height: 1.25; overflow-wrap: anywhere; }
  p { margin: 0 0 16px; color: #b9bbc7; overflow-wrap: anywhere; }
  .address {
    display: inline-block; padding: 2px 8px; border-radius: 6px; background: #2a2d35;
    font-family: ui-monospace, Consolas, monospace; color: #e6e6eb;
  }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
  a.button {
    display: block; padding: 11px 16px; border-radius: 8px; text-decoration: none;
    font-weight: 600; background: #2a2d35; color: #e6e6eb;
  }
  a.button.primary { background: #5865f2; color: #fff; }
  a.button:hover { filter: brightness(1.12); }
  a.button:focus-visible { outline: 2px solid #9aa3ff; outline-offset: 2px; }
  .muted { margin: 20px 0 0; font-size: 13px; color: #7d808e; }
</style>
</head>
<body>
<main>
<div class="icon" aria-hidden="true">H</div>
<p class="eyebrow">Hermes chat server</p>
<h1>hermes.senko.tools</h1>
<p>Spaces with text and voice channels, direct messages and voice calls, on a server you can
run yourself.</p>
<p>To join, open an invite link from a member, or add
<span class="address">hermes.senko.tools</span> in the Hermes app.</p>
<div class="actions">
<a class="button primary" href="https://github.com/senko-tools/hermes/releases/latest">Download Hermes</a>
<a class="button" href="https://github.com/senko-tools/hermes">Source code</a>
</div>
</main>
</body>
</html>
