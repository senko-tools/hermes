[package]
name = "hermes-audio"
description = "Hermes audio engine: capture, playback, resampling, noise suppression, Opus, jitter buffer, mixer"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
hermes-proto.workspace = true
aec3.workspace = true
cpal.workspace = true
nnnoiseless.workspace = true
opus.workspace = true
ringbuf.workspace = true
rubato.workspace = true
tracing.workspace = true

# Linux: PulseAudio's own protocol (pure Rust), also served by PipeWire on today's desktops, so
# Hermes reaches the sound server even where ALSA has no PulseAudio/PipeWire plugin. Without a
# server, ALSA as before (approved 2026-11-24, round 45).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pulseaudio"] }

[lints]
workspace = true
