[package]
name = "hermes-gui"
description = "Hermes desktop client"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "hermes"
path = "src/main.rs"

[dependencies]
syntect.workspace = true
hermes-audio.workspace = true
hermes-client-core.workspace = true
arboard.workspace = true
clap = { workspace = true, features = ["derive"] }
directories.workspace = true
futures-util.workspace = true
global-hotkey.workspace = true
gpui-kit.workspace = true
image = { workspace = true, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
png.workspace = true
libwebp-sys.workspace = true
resvg.workspace = true
notify.workspace = true
notify-rust.workspace = true
openh264.workspace = true
# The window handle, to hide the window to the tray (gpui cannot; approved 2026-11-07).
raw-window-handle = "=0.6.2"
rfd.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows APIs: Desktop Duplication, Media Foundation and the shader
# compiler for screen sharing, process loopback for a share's sound, push-to-talk polling, minidumps, and hiding the window to the tray.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
xcap.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The tray icon runs on a GTK thread of its own (desktop/tray.rs).
gtk.workspace = true
# Push-to-talk and idle time on X11; global shortcuts and screen casts through the portals.
x11rb.workspace = true
# gpui's Linux platform (patched in vendor/), for hiding a Wayland window to the tray.
gpui-pre-linux = "=0.3.12"
# The shared memory X11 screen capture writes into.
memmap2.workspace = true
ashpd.workspace = true
# Wayland screen casts (frames) and a share's sound.
pipewire.workspace = true
# Idle time on Wayland (ext-idle-notify-v1), on a connection of our own.
wayland-client.workspace = true
wayland-protocols.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
hermes-client-core = { workspace = true, features = ["testing"] }
# The end-to-end tests run a real server (PLAN.md section 19); never a normal dependency.
hermes-server = { path = "../hermes-server", features = ["testing"] }
# Headless windows for the UI tests: the gpui the kit pins, with its test platform on. Directly,
# because the kit's own test-support feature would force taffy down in the app too.
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

[lints]
workspace = true
