[package]
name = "hermes-gui"
description = "Hermes desktop client (iced)"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "hermes"
path = "src/main.rs"

[dependencies]
hermes-client-core.workspace = true
arboard.workspace = true
clap = { workspace = true, features = ["derive"] }
directories.workspace = true
futures-util.workspace = true
global-hotkey.workspace = true
iced = { workspace = true, features = ["tokio", "advanced", "image", "svg"] }
image = { workspace = true, features = ["png", "webp"] }
notify.workspace = true
notify-rust.workspace = true
openh264.workspace = true
rfd.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true

[target.'cfg(windows)'.dependencies]
# Push-to-talk key polling (PLAN.md section 21, Spike C decision); Desktop Duplication for
# screen sharing (the Direct3D 11 and DXGI features xcap enables already); Media Foundation for
# hardware H.264 encoding (part of Windows); the shader compiler that draws the mouse pointer
# into shares (part of Windows); minidumps of a frozen UI (dbghelp, part of Windows).
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Screen capture for screen sharing (Windows only for now).
xcap.workspace = true

[dev-dependencies]
# The end-to-end tests run a real server (PLAN.md section 19); never a normal dependency.
hermes-server = { path = "../hermes-server" }

[lints]
workspace = true
