[package]
name = "hermes-gui"
description = "Hermes desktop client (iced)"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "hermes"
path = "src/main.rs"

[dependencies]
hermes-client-core.workspace = true
arboard.workspace = true
clap = { workspace = true, features = ["derive"] }
directories.workspace = true
futures-util.workspace = true
iced = { workspace = true, features = ["tokio", "advanced", "image"] }
image = { workspace = true, features = ["png"] }
notify.workspace = true
rfd.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The end-to-end tests run a real server (PLAN.md section 19); never a normal dependency.
hermes-server = { path = "../hermes-server" }

[lints]
workspace = true
