[package]
name = "hermes-gui"
description = "Hermes desktop client"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "hermes"
path = "src/main.rs"

[dependencies]
hermes-audio.workspace = true
hermes-client-core.workspace = true
arboard.workspace = true
clap = { workspace = true, features = ["derive"] }
directories.workspace = true
futures-util.workspace = true
global-hotkey.workspace = true
gpui-kit.workspace = true
image = { workspace = true, features = ["png", "jpeg", "webp", "gif"] }
notify.workspace = true
notify-rust.workspace = true
openh264.workspace = true
# The window handle, to hide the window to the tray (gpui cannot; approved 2026-11-07).
raw-window-handle = "=0.6.2"
rfd.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon.workspace = true

[target.'cfg(windows)'.dependencies]
# The same Windows APIs as the iced client: Desktop Duplication, Media Foundation and the shader
# compiler for screen sharing, push-to-talk polling, minidumps, and hiding the window to the tray.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
xcap.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# The end-to-end tests run a real server (PLAN.md section 19); never a normal dependency.
hermes-server = { path = "../hermes-server" }
# Headless windows for the UI tests: the gpui the kit pins, with its test platform on. Directly,
# because the kit's own test-support feature would force taffy down in the app too.
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }

[lints]
workspace = true
