# Built-in dark theme (PLAN.md section 15.5). Copy this file to <config dir>/themes/<name>.toml
# and set `general.theme = "<name>"` to make your own; keys you leave out use these values.
# Warm charcoal with a gold accent; `buttons.primary.background` is the accent color.

[general]
background = "#1d1c22"
border = "#2e2c36"
horizontal_rule = "#2b2932"
unread_indicator = "#f3eee7"
scrollbar = "#3b3845"

[text]
primary = "#ece7e0"
secondary = "#aca5a1"
tertiary = "#77717c"
success = "#80c48c"
error = "#e8737c"
warning = "#e8b764"
info = "#82aae8"
link = "#86b8f0"
mention_bg = "#e5a5502a"
code_bg = "#26242e"

[buttons.primary]
background = "#e5a550"
background_hover = "#f0b86b"
text = "#1d1c22"

[buttons.secondary]
background = "#2d2b35"
background_hover = "#383541"
text = "#ece7e0"

[buttons.danger]
background = "#d65c66"
background_hover = "#e3727b"
text = "#ffffff"

[sidebar]
background = "#17161c"
selected = "#2b2833"
hover = "#221f29"

[pane]
header_bg = "#1d1c22"
focused_border = "#e5a550"

[voice]
speaking_ring = "#80c48c"
muted = "#e8737c"

[presence]
online = "#80c48c"
idle = "#e8b764"
dnd = "#e8737c"
offline = "#77717c"

[roles]
default_color = "#ece7e0"

# --- Sections added later (docs/DECISIONS.md). A theme file that leaves them out gets them
# --- from its own keys above, so older themes keep their look.

# Background levels, darkest to lightest.
[surface]
deep = "#141319"        # dimmed window behind dialogs
footer = "#17161c"      # voice and user panels at the bottom of the sidebar
main = "#1d1c22"        # chat and page content
sidebar = "#17161c"     # sidebar, member list, settings navigation
raised = "#26242e"      # inputs, composer, cards, code
overlay = "#17161c"     # menus, tooltips
hover = "#221f29"       # hovered rows and buttons

[accent]
base = "#e5a550"        # switches, focus lines, selected icons
highlight = "#f0b86b"   # hovered accent things, the space name
muted = "#9f7540"
glow = "#e5a55026"      # see-through tint for selections
focus = "#e5a550"       # border of a focused input

[icons]
default = "#aca5a1"
active = "#ece7e0"

# Sidebar row states: the bar on the left edge, the row background, the background on hover.
[channel]
selected_border = "#00000000"
selected_bg = "#2b2833"
selected_hover = "#2b2833"
unread_border = "#f3eee7"
unread_bg = "#00000000"
unread_hover = "#221f29"
mention_border = "#f3eee7"
mention_bg = "#00000000"
mention_hover = "#221f29"
connected_border = "#80c48c"   # the voice channel or call you are in
connected_bg = "#80c48c1f"
connected_hover = "#80c48c33"
text = "#aca5a1"
category = "#77717c"

# Corner radii and the width of the row state bar, in pixels.
[shape]
radius = 6                    # buttons, inputs, menus
row_radius = 6                # rows in lists
radius_large = 10
indicator_width = 3
