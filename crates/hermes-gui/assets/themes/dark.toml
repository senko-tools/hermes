# Built-in dark theme (PLAN.md section 15.5). Copy this file to <config dir>/themes/<name>.toml
# and set `general.theme = "<name>"` to make your own; keys you leave out use these values.
# Warm charcoal with a gold accent; `buttons.primary.background` is the accent color.

[general]
background = "#1d1c22"
border = "#2e2c36"
horizontal_rule = "#2b2932"
unread_indicator = "#f3eee7"
scrollbar = "#3b3845"

[text]
primary = "#ece7e0"
secondary = "#aca5a1"
tertiary = "#77717c"
success = "#80c48c"
error = "#e8737c"
warning = "#e8b764"
info = "#82aae8"
link = "#86b8f0"
mention_bg = "#e5a5502a"
code_bg = "#26242e"

[buttons.primary]
background = "#e5a550"
background_hover = "#f0b86b"
text = "#1d1c22"

[buttons.secondary]
background = "#2d2b35"
background_hover = "#383541"
text = "#ece7e0"

[buttons.danger]
background = "#d65c66"
background_hover = "#e3727b"
text = "#ffffff"

[sidebar]
background = "#17161c"
selected = "#2b2833"
hover = "#221f29"

[pane]
header_bg = "#1d1c22"
focused_border = "#e5a550"

[voice]
speaking_ring = "#80c48c"
muted = "#e8737c"

[presence]
online = "#80c48c"
idle = "#e8b764"
dnd = "#e8737c"
offline = "#77717c"

[roles]
default_color = "#ece7e0"
