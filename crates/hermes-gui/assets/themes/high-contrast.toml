# Built-in high-contrast theme (PLAN.md section 15.5).

[general]
background = "#000000"
border = "#ffffff"
horizontal_rule = "#ffffff"
unread_indicator = "#ffffff"
scrollbar = "#ffffff"

[text]
primary = "#ffffff"
secondary = "#ffffff"
tertiary = "#d0d0d0"
success = "#00ff7f"
error = "#ff5c5c"
warning = "#ffd700"
info = "#7fd4ff"
link = "#ffff00"
mention_bg = "#4d3d00"
code_bg = "#1a1a1a"

[buttons.primary]
background = "#ffff00"
background_hover = "#ffffff"
text = "#000000"

[buttons.secondary]
background = "#000000"
background_hover = "#333333"
text = "#ffffff"

[buttons.danger]
background = "#ff5c5c"
background_hover = "#ff8a8a"
text = "#000000"

[sidebar]
background = "#000000"
selected = "#333333"
hover = "#1a1a1a"

[pane]
header_bg = "#000000"
focused_border = "#ffff00"

[voice]
speaking_ring = "#00ff7f"
muted = "#ff5c5c"

[presence]
online = "#00ff7f"
idle = "#ffd700"
dnd = "#ff5c5c"
offline = "#d0d0d0"

[roles]
default_color = "#ffffff"

# --- Sections added later (docs/DECISIONS.md). A theme file that leaves them out gets them
# --- from its own keys above, so older themes keep their look.

# Background levels, darkest to lightest.
[surface]
deep = "#000000"        # behind the voice and user panels
main = "#000000"        # chat and page content
sidebar = "#000000"     # sidebar, member list, settings navigation
raised = "#1a1a1a"      # inputs, composer, cards, code
overlay = "#000000"     # menus, tooltips
hover = "#1a1a1a"       # hovered rows and buttons

[accent]
base = "#ffff00"        # switches, focus lines, selected icons
highlight = "#ffffff"   # hovered accent things, the space name
muted = "#a6a600"
glow = "#ffff0026"      # see-through tint for selections
focus = "#ffff00"       # border of a focused input

[icons]
default = "#ffffff"
active = "#ffffff"

# Sidebar row states: the bar on the left edge, the row background, the background on hover.
[channel]
selected_border = "#00000000"
selected_bg = "#333333"
selected_hover = "#333333"
unread_border = "#ffffff"
unread_bg = "#00000000"
unread_hover = "#1a1a1a"
mention_border = "#ffffff"
mention_bg = "#00000000"
mention_hover = "#1a1a1a"
connected_border = "#00ff7f"   # the voice channel or call you are in
connected_bg = "#333333"
connected_hover = "#333333"

# Corner radii and the width of the row state bar, in pixels.
[shape]
radius = 6
radius_large = 10
indicator_width = 3
