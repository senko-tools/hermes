# Built-in neko theme: warm dusk greys with a soft pink accent, square corners and a thin state
# bar on sidebar rows. Ported from the developer's Vencord theme (Neko_Dev.css); the comments name
# the CSS variable each colour comes from.

[general]
background = "#1a1617"        # --neko-bg-main
border = "#453a3d"            # --neko-border
horizontal_rule = "#362d30"   # --neko-bg-soft
unread_indicator = "#f2ecee"  # --neko-text
scrollbar = "#3f3538"         # --neko-bg-highest

[text]
primary = "#f2ecee"           # --neko-text
secondary = "#c5bcbf"         # --neko-text-subtle
tertiary = "#817578"          # --neko-text-faint
success = "#6aa694"           # --neko-positive
error = "#ba465b"             # --neko-negative
warning = "#e0b06b"           # --neko-warning
info = "#e2b2be"              # --neko-link
link = "#e2b2be"              # --neko-link
mention_bg = "#eec1c82e"      # --mention-background
code_bg = "#251f21"           # --neko-bg-surface

[buttons.primary]
background = "#d4a5b2"        # --neko-accent
background_hover = "#eec1c8"  # --neko-accent-highlight
text = "#1a1617"              # --neko-text-inverse

[buttons.secondary]
background = "#362d30"        # --neko-bg-soft
background_hover = "#3f3538"  # --neko-bg-highest
text = "#f2ecee"

[buttons.danger]
background = "#ba465b"        # --neko-negative
background_hover = "#cc5a6e"
text = "#fbf8f9"              # --neko-text-strong

[sidebar]
background = "#251f21"        # --neko-bg-surface
selected = "#3f3538"          # --neko-bg-highest
hover = "#362d30"             # --neko-bg-soft

[pane]
header_bg = "#251f21"         # --neko-bg-surface
focused_border = "#d4a5b2"    # --neko-accent

[voice]
speaking_ring = "#eec1c8"     # --status-speaking
muted = "#ba465b"

[presence]
online = "#6aa694"
idle = "#e0b06b"
dnd = "#ba465b"
offline = "#817578"

[roles]
default_color = "#f2ecee"

# Background levels, darkest to lightest.
[surface]
deep = "#141112"              # --neko-bg-deep
footer = "#2d2629"            # --neko-bg-raised
main = "#1a1617"              # --neko-bg-main
sidebar = "#251f21"           # --neko-bg-surface
raised = "#2d2629"            # --neko-bg-raised
overlay = "#362d30"           # --neko-bg-soft
hover = "#362d30"             # --neko-hover

[accent]
base = "#d4a5b2"              # --neko-accent
highlight = "#eec1c8"         # --neko-accent-highlight
muted = "#a3818a"             # --neko-accent-muted
glow = "#d4a5b226"            # --neko-accent-glow
focus = "#8c6a74"             # --neko-border-focus

[icons]
default = "#d4a5b2"           # --icon-default
active = "#eec1c8"            # --interactive-icon-hover

# Sidebar row states (section 3 of the CSS): bar, background, hover background.
[channel]
selected_border = "#d4a5b2"
selected_bg = "#d4a5b226"
selected_hover = "#d4a5b240"
unread_border = "#f2eceebf"
unread_bg = "#f2ecee0d"
unread_hover = "#f2ecee1a"
mention_border = "#eec1c8"
mention_bg = "#eec1c826"
mention_hover = "#eec1c840"
# Green like the voice-connected text, so it differs from the selected pink.
connected_border = "#6aa694"
connected_bg = "#6aa69426"
connected_hover = "#6aa69440"

[shape]
radius = 4                    # buttons, inputs, menus: a little rounding
row_radius = 0                # --neko-indicator-rounding: rows stay square
radius_large = 6
indicator_width = 2           # --neko-indicator-size
