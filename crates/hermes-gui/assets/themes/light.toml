# Built-in light theme (PLAN.md section 15.5). Warm paper with a deep gold accent.

[general]
background = "#fbf9f6"
border = "#e3ddd5"
horizontal_rule = "#ebe6df"
unread_indicator = "#1f1c24"
scrollbar = "#cfc8bf"

[text]
primary = "#28242e"
secondary = "#5c5560"
tertiary = "#8f8790"
success = "#2f8a4a"
error = "#c8414b"
warning = "#a86a0e"
info = "#2f68c4"
link = "#1f63c8"
mention_bg = "#c47b1a24"
code_bg = "#f1ece5"

[buttons.primary]
background = "#b86f12"
background_hover = "#9e5e0c"
text = "#ffffff"

[buttons.secondary]
background = "#ebe5dd"
background_hover = "#e0d9cf"
text = "#28242e"

[buttons.danger]
background = "#c8414b"
background_hover = "#a9333c"
text = "#ffffff"

[sidebar]
background = "#f3efe9"
selected = "#e4ddd3"
hover = "#ebe6de"

[pane]
header_bg = "#fbf9f6"
focused_border = "#b86f12"

[voice]
speaking_ring = "#2f8a4a"
muted = "#c8414b"

[presence]
online = "#2f8a4a"
idle = "#c28412"
dnd = "#c8414b"
offline = "#8f8790"

[roles]
default_color = "#28242e"
