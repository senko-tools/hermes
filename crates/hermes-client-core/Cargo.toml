[package]
name = "hermes-client-core"
description = "Hermes client core: connection management, REST and gateway client, state store, voice transport, config"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
hermes-proto.workspace = true
hermes-audio.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
hkdf.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true
directories.workspace = true
emojis.workspace = true
futures-util.workspace = true
keyring.workspace = true
notify.workspace = true
quinn.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# The local UTC offset for timestamps (time.rs).
windows = { workspace = true, features = ["Win32_System_Time"] }

[dev-dependencies]
# Integration tests run a real server (PLAN.md section 19); never a normal dependency.
hermes-server = { path = "../hermes-server" }

[lints]
workspace = true
