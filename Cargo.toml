[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/senko-tools/hermes"
homepage = "https://hermes.senko.tools"

# Shared dependency versions (PLAN.md section 6), pinned exactly.
# Crates opt in with `name.workspace = true` and may add features locally.
[workspace.dependencies]
# Internal crates
hermes-proto = { path = "crates/hermes-proto" }
hermes-audio = { path = "crates/hermes-audio" }
hermes-client-core = { path = "crates/hermes-client-core" }

# Async runtime
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }

# HTTP server
axum = { version = "=0.8.9", features = ["ws"] }
tower = "=0.5.3"
tower-http = "=0.7.1"
tower_governor = { version = "=0.8.0", default-features = false, features = ["axum"] }

# TLS
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "logging", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["logging", "tls12", "ring"] }
rcgen = "=0.14.10"
rustls-platform-verifier = "=0.7.1"  # OS trust store for the clients (approved, see docs/DECISIONS.md)
arc-swap = "=1.9.3"  # certificate reload (PLAN.md section 9.1; not listed in section 6)

# Database
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# QUIC
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }

bytes = "=1.12.1"  # cheap datagram clones for voice forwarding (PLAN.md 12.4; see docs/DECISIONS.md)

# Serialization
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Password hashing, randomness, hashing
argon2 = "=0.6.0"
rand = "=0.10.3"
sha2 = "=0.11.1"
base64 = "=0.23.1"

# Config, CLI, logging
figment = { version = "=0.10.19", features = ["toml", "env"] }
toml = "=0.8.23"  # same version figment uses; serializes the effective config in `check-config`
toml_edit = "=0.22.27"  # same version toml uses; edits the client config keeping comments (section 17)
clap = { version = "=4.6.7", features = ["derive"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }

# Images (server), permissions
image = { version = "=0.25.10", default-features = false }  # crates enable the formats they need
bitflags = "=2.13.2"

# Client networking
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "=0.3.34"  # StreamExt/SinkExt for the gateway client and the server tests

# Audio
cpal = "=0.18.2"
opus = "=0.4.0"
rubato = "=5.0.1"
nnnoiseless = { version = "=0.5.2", default-features = false }
ringbuf = "=0.6.0"

# GUI / TUI
iced = "=0.14.0"
ratatui = "=0.30.2"
crossterm = { version = "=0.29.0", features = ["event-stream"] }

# Markup, emoji
pulldown-cmark = "=0.13.6"
emojis = "=0.9.1"

# Screen sharing (approved 2026-11-02, see docs/DECISIONS.md): capture (Windows) and H.264 built
# from OpenH264's bundled source
xcap = { version = "=0.9.8", default-features = false }
openh264 = "=0.9.9"

# Desktop integration
arboard = "=3.7.0"
rfd = "=0.17.2"  # file dialog for the GUI "+" button (PLAN.md 15.3; approved, see docs/DECISIONS.md)
notify-rust = "=4.18.2"
tray-icon = "=0.26.1"
global-hotkey = "=0.9.0"
keyring = "=4.2.0"
directories = "=6.0.0"
notify = "=8.2.1"

# Windows API (push-to-talk key polling fallback, PLAN.md section 21)
windows = { version = "=0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The audio path is real-time: unoptimized DSP in debug builds falls behind when two voice
# clients and a server share one slow CI runner. Optimize just these crates in dev/test builds.
[profile.dev.package]
hermes-audio = { opt-level = 3 }
opus = { opt-level = 3 }
opusic-sys = { opt-level = 3 }
nnnoiseless = { opt-level = 3 }
easyfft = { opt-level = 3 }
rubato = { opt-level = 3 }
realfft = { opt-level = 3 }
rustfft = { opt-level = 3 }
transpose = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
